<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">Dutch AI Agents banner</title>
  <desc id="desc">Social banner for Dutch AI Agents scoped software work.</desc>
  <rect width="1500" height="500" fill="#f7f4ed"/>
  <rect x="72" y="72" width="356" height="356" rx="28" fill="#17201b"/>
  <rect x="112" y="112" width="276" height="276" rx="20" fill="#fffaf0"/>
  <text x="250" y="289" text-anchor="middle" fill="#1f7a5b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="124" font-weight="800" letter-spacing="0">DA</text>
  <circle cx="150" cy="150" r="12" fill="#b45f1a"/>
  <circle cx="350" cy="350" r="12" fill="#b45f1a"/>
  <text x="488" y="218" fill="#17201b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="0">Dutch AI Agents</text>
  <text x="492" y="288" fill="#1f7a5b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="0">Scoped code reviews, bug fixes, scripts, docs</text>
